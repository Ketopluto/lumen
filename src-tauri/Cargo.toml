[package]
name = "lumen"
version = "4.0.0"
description = "A lightweight live wallpaper manager"
authors = ["Ketopluto"]
edition = "2021"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
wallpaper = { version = "3", default-features = false }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
log = "0.4"
rand = "0.8"
dirs = "5"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.9"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
starship-battery = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
gtk = { version = "0.18", features = ["v3_24"] }
libloading = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
