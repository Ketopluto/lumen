name: Release

# Tag a commit to build installers for every platform:
#     git tag v4.0.0 && git push origin v4.0.0
# The release is created as a draft, so nothing is public until it is reviewed and published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Create or reuse the draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A draft carries no git tag yet, so a re-run can only find it by listing releases —
          # and that listing lags a few seconds behind a fresh create, so the id of a new draft
          # comes straight out of the POST instead.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                 --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1 || true)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                   -f tag_name="$TAG" -f name="Lumen ${TAG#v}" \
                   -F body=@.github/RELEASE_NOTES.md -F draft=true --jq .id)
          fi
          # Without an id, tauri-action quietly skips every upload and the release ships empty.
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    # No single platform can hold back a release: a flaky tool download on one runner used to
    # mean nobody got anything. What a release must have is checked before publishing instead,
    # and a platform that missed out is named so its build can be re-run into the same release.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            args: ''
          # Two separate Macs rather than a universal binary: half the download, and the two
          # architectures are built and signed independently.
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            optional: true
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            optional: true
          - name: Linux (x64)
            os: ubuntu-22.04
            args: ''
            optional: true

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # webkit2gtk 4.1 is what Tauri 2 links against; ubuntu-22.04 is the oldest image that
      # carries it, which keeps the glibc floor as low as we can manage. The GStreamer packages
      # are what bundleMediaFramework copies into the AppImage, so video plays there too.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev libgtk-layer-shell-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - run: npm ci

      # Tauri fetches its bundler tools (NSIS, AppImage tooling) at bundle time, and that download
      # has 504'd on three of the last four releases. Cached, it happens once per runner.
      - name: Cache the bundler tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri
            ~/AppData/Local/tauri
          key: tauri-bundler-${{ runner.os }}-v1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}

      # Nothing is trusted to have worked just because a step exited zero — today's silent
      # installer failure came from exactly that assumption.
      - name: The build must have produced an installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ls -l src-tauri/target/release/bundle/nsis/*.exe

      # The bare executable, for people who would rather not run an installer.
      - name: Upload the portable Windows build
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cp src-tauri/target/release/lumen.exe "Lumen_${version}_x64_portable.exe"
          gh release upload "$TAG" "Lumen_${version}_x64_portable.exe" --clobber

  publish:
    name: Publish the release
    needs: [draft, build]
    runs-on: ubuntu-22.04
    steps:
      # Every platform that is allowed to block has finished, so this is the latest release from
      # now on. Nothing is left as a draft: a draft is invisible to the app's update check.
      - name: Check what was uploaded, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets" | sed 's/^/  /'
          for required in "Lumen_${version}_x64-setup.exe" "Lumen_${version}_x64_portable.exe"; do
            echo "$assets" | grep -qx "$required" || { echo "::error::missing $required"; exit 1; }
          done
          for optional in "Lumen_${version}_amd64.deb" "Lumen_${version}_aarch64.dmg" "Lumen_${version}_x64.dmg"; do
            echo "$assets" | grep -qx "$optional" || echo "::warning::$optional is missing — re-run that platform's job to add it to this release"
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url --jq '"published: draft=\(.isDraft) \(.url)"'
