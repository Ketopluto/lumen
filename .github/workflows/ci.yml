name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless. A run you started by hand is
# its own group, so pushing while the macOS leg is running does not cancel the thing you asked for.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is on demand. Its runners are scarce enough that the leg regularly never gets a
        # machine, and a job that is never scheduled fails the run no matter what the code did —
        # it failed a CSS-only commit this way. macOS still compiles on every release tag, and
        # here whenever you ask for it with "Run workflow".
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["windows-latest", "ubuntu-22.04", "macos-latest"]') || fromJSON('["windows-latest", "ubuntu-22.04"]') }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Tauri 2 needs webkit2gtk 4.1; ubuntu-22.04 is the oldest image that has it, which also
      # keeps the glibc requirement as low as we can manage.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev xvfb \
            libgtk-layer-shell-dev

      - run: npm ci

      # Runs tsc, so TypeScript regressions fail the build.
      - run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # The only verification macOS and Linux get without a machine to run them on: this compiles
      # every platform backend, including all the objc2 and GTK calls.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Puts a real surface on a real window server and asks the platform where it ended up. On
      # macOS and Linux this is the only check that runs the placement code rather than compiling
      # it. Exit 2 means there was nothing to test here; only exit 1 is a failure.
      - name: Live surface placement
        shell: bash
        env:
          LUMEN_DATA_DIR: ${{ runner.temp }}/lumen-selftest
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml
          binary=src-tauri/target/debug/lumen
          [ "$RUNNER_OS" = "Windows" ] && binary=$binary.exe
          code=0
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$binary" --selftest || code=$?
          else
            "$binary" --selftest || code=$?
          fi
          echo "selftest exit code: $code"
          [ "$code" -ne 1 ]

      # attach() owns visibility — see the contract in services/desktop/mod.rs.
      - name: The engine must not call show() on a live surface
        if: runner.os == 'Windows'
        shell: bash
        run: '! grep -n "\.show()" src-tauri/src/services/wallpaper_engine.rs'
