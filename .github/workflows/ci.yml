name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Tauri 2 needs webkit2gtk 4.1; ubuntu-22.04 is the oldest image that has it, which also
      # keeps the glibc requirement as low as we can manage.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev \
            libgtk-layer-shell-dev

      - run: npm ci

      # Runs tsc, so TypeScript regressions fail the build.
      - run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # The only verification macOS and Linux get without a machine to run them on: this compiles
      # every platform backend, including all the objc2 and GTK calls.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # attach() owns visibility — see the contract in services/desktop/mod.rs.
      - name: The engine must not call show() on a live surface
        if: runner.os == 'Windows'
        shell: bash
        run: '! grep -n "\.show()" src-tauri/src/services/wallpaper_engine.rs'
